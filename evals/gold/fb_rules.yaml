    expected_answer: "The ESO must switch off the TSMS and the TSAL must have changed to green before anyone is allowed to touch the vehicle or the outgoing driver can climb out. Separately, each team is given three minutes for the driver change; if it takes longer than that, the extra time is included in the team's final time."
