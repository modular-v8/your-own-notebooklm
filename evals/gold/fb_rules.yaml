    turns:
      - question: "If a team's vehicle has aerodynamic devices or sensors mounted in front of the front bulkhead, what are the three ways they're allowed to prove that combination won't exceed the IA's peak deceleration limit?"
    expected_answer: "Physical testing of the IA assembly together with the attached non-crushable object(s) (or structurally representative dummies of them) in front of the AIP; combining the peak force from physical testing of the IA assembly with the failure load for mounting the non-crushable object(s), calculated from fastener shear and/or link buckling; or combining the \"standard\" IA peak load of 95 kN with that same failure-load calculation for the non-crushable object(s)' mounting."
    sources:
