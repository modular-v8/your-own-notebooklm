  - id: q-039
    turns:
      - question: "Does the 13 kN load requirement for shoulder and lap belt attachment points also apply to lap and anti-submarine belt attachments when they're mounted close together?"
    expected_answer: "No. T4.5.3 requires shoulder and lap belt attachment points to support 13 kN, and anti-submarine belt attachment points to support 6.5 kN, individually. T4.5.4 sets a separate, combined figure for a different situation: if the lap belts and anti-submarine belts are attached less than 100 mm apart, those attachment points together must support a total load of 19.5 kN -- not 13 kN."
    sources:
      - doc: fb_rules.pdf
        answer_location: { type: section, value: ["T4.5.3"] }
      - doc: fb_rules.pdf
        answer_location: { type: section, value: ["T4.5.4"] }
    tags: [near-duplicate]
    # T4.5.4 is also the follow-up answer source for q-031; here it's paired
    # against T4.5.3 instead, testing whether the individual per-point loads
    # get confused with the separate combined-load figure.

  - id: q-040
    turns:
      - question: "If a team's tires are designed for both dry and wet use but don't have the required tread, can they still be raced at all -- the same way a dedicated wet tire can when the track isn't wet?"
    expected_answer: "No, it works the other way around. Per T2.6.5, a dual-purpose dry/wet tire that lacks the tread or grooves required by T2.5.1 simply loses its \"wet\" status -- the team can't race it if the track is declared wet, but the tire can still be used as a dry tire. Per T2.6.6, a tire specifically constructed for wet conditions is the reverse case: it can only be used under \"Damp\" or \"Wet\" operating conditions and cannot be used as a dry tire at all."
    sources:
      - doc: fb_rules.pdf
        answer_location: { type: section, value: ["T2.6.5"], occurrence: last }
      - doc: fb_rules.pdf
        answer_location: { type: section, value: ["T2.6.6"], occurrence: last }
    tags: [near-duplicate]
    # both rules govern which tires may be used in which conditions and both
    # collide with the changelog, so both need occurrence: last. The parallel
    # phrasing ("dry and wet"-designed vs "specifically constructed for wet")
    # is exactly the kind of near-identical pair reranking should untangle.

  - id: q-041
    turns:
      - question: "Does the upper-member height rule for the side impact structure -- the three steel tubes flanking the cockpit -- also apply, range and all, to other impact structures protecting side-projecting components?"
    expected_answer: "Not quite. The side impact structure's upper member (T3.15.1) must sit at a height between 240 mm and 320 mm above the lowest inside chassis point between the front and main hoop -- a defined range. Other impact structures covered by T3.15.2 (referenced from CV1.3.2, EV4.4.2, and EV5.5.2) only cap that upper member at not higher than 320 mm -- there's no stated lower bound for those."
    sources:
