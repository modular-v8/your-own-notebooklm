  - id: q-052
    turns:
      - question: "What immediately starts happening to the e-gear's hydraulic pressure when you open the door or switch on the ignition?"
        answer: "The electric pump immediately starts building pressure in the accumulator."
      - question: "What should the driver do if they can still hear it running?"
    expected_answer: "Wait. If the pump is still audibly running, it hasn't finished building pressure yet, and the correct move is to let it finish before asking the car to do anything -- every shift consumes stored pressure, and a healthy system quietly tops the accumulator back up in the background as you drive."
