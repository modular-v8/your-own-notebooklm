  - id: q-044
    turns:
      - question: "How many mechanical relays does a CV shutdown circuit need at minimum and what does each one control, and separately, what must happen to any shutdown-circuit component if it loses power?"
    expected_answer: "At least two mechanical relays: one for the fuel pump, and at least one for injection and ignition. Separately, every circuit that's part of the shutdown circuit must be designed so that in the de-energized or disconnected state, it opens the shutdown circuit."
