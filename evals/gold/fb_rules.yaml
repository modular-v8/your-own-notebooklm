  - id: q-054
    turns:
      - question: "For a normal, pre-selected shift, how does the AMG SpeedShift MCT's shift time compare to a dual-clutch transmission's?"
        answer: "A DCT can shift a sequential change, where the next gear is already pre-selected, in roughly 50 ms -- faster than the MCT's ~100 ms for a single shift."
      - question: "What happens if that pre-selected-gear assumption doesn't hold, like for a big downshift?"
    expected_answer: "A DCT is only that fast when the next gear is pre-armed; asked for an out-of-sequence change, such as a big multi-gear downshift, it slows right down. The MCT, by contrast, shifts an out-of-sequence, multi-gear change just as fast as a single one -- which is why several owners prefer it on the road."
