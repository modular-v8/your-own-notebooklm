  # --- cross-document (4 new; 1 -> 5) ---

  - id: q-056
    turns:
      - question: "Both the Formula Bharat rulebook's IMD requirement and the egear document describe a system that shuts things down when it can't confirm everything is working correctly. What triggers each one?"
    expected_answer: "The Insulation Monitoring Device (IMD) must open the EV shutdown circuit if it detects either an insulation failure or a failure of the IMD itself, and this must happen without any programmable logic involved. In Lamborghini's e-gear, if the two Hall-effect position sensors don't confirm that a commanded gear was actually reached, the system can disable the car outright as a safety measure. Both intervene by cutting the system off entirely once a monitoring or confirmation signal comes back wrong, rather than letting the vehicle keep operating in an unverified state."
    sources:
      - doc: fb_rules.pdf
        answer_location: { type: section, value: ["EV6.3.6"] }
      - doc: egear.md
        answer_location: { type: line_range, start: 25, end: 25 }
    tags: [cross-document, synthesis]
    # a second instance of the "same underlying problem, two documents" shape
    # already exploited by q-036, using a different pdf rule and a different
    # md document so the tag isn't resting on one anchor pair.

  - id: q-057
    turns:
      - question: "Both the SMG and Tiptronic documents mention a gearbox that adapts its shifting to the driver over time. Is this treated as new or unusual technology in either document?"
    expected_answer: "No -- in both, adaptive shift behavior is described as long-standing and ordinary, not a novelty. The Tiptronic document says this adaptive shift logic, learning the driver's habits and shifting accordingly, was already standard in these boxes well before \"adaptive\" became a buzzword. The SMG document separately notes that the SMG's computer is constantly learning how the driver drives and tailoring its shift strategy to suit them, which is exactly why the car can feel alien to a different driver and why flashing and resetting the DME software -- wiping the old adaptations -- is a well-known fix."
    sources:
      - doc: tiptronic.md
        answer_location: { type: line_range, start: 23, end: 23 }
      - doc: smg.md
        answer_location: { type: line_range, start: 74, end: 74 }
    tags: [cross-document, synthesis]

  - id: q-058
    turns:
      - question: "Is the Mercedes transmission that Porsche switched to for its post-2002 Tiptronic the same transmission family that AMG later turned into the SpeedShift MCT?"
    expected_answer: "No. Porsche's post-2002 Tiptronic used the Mercedes-Benz 722.6. AMG's SpeedShift MCT was built by replacing the torque converter in the different 7-speed 722.9 architecture (the 7G-Tronic family, which later evolved into the 9G-Tronic / 725.0). Both are Mercedes automatic transmission families, but they are not the same one."
    sources:
      - doc: tiptronic.md
        answer_location: { type: line_range, start: 41, end: 41 }
      - doc: amg_mct.md
        answer_location: { type: line_range, start: 17, end: 17 }
    tags: [cross-document]
    # deliberately targets a plausible-sounding but false cross-document
    # link: the two documents share "Mercedes automatic transmission" and
    # adjacent 722.x numbering (722.6 vs 722.9), which is exactly the kind of
    # near-miss a whole-document or coarse-retrieval baseline could conflate
    # into a false "yes, same gearbox" answer.

  - id: q-059
    turns:
      - question: "Both the SMG and e-gear documents converge on the same core piece of ownership advice for driving these single-clutch gearboxes. What is it, and what's the documented consequence of ignoring it?"
    expected_answer: "Both documents say to drive the car like the manual it fundamentally is -- with an invisible clutch pedal -- rather than like a true automatic. e-gear owners who drive it the automatic way have reportedly needed a clutch replacement inside 4,000 miles, versus roughly 2% wear over 6,000 miles for disciplined drivers; the SMG document's version of the same idea is a deliberate lift off the throttle during a shift, mimicking manual driving, which smooths out the gearbox's clunky, jerky character."
    sources:
      - doc: egear.md
        answer_location: { type: line_range, start: 73, end: 73 }
      - doc: smg.md
        answer_location: { type: line_range, start: 72, end: 72 }
    tags: [cross-document]