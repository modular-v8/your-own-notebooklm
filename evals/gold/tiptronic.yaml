entries:
  - id: q-001
    question: "What torque was the ZF 5HP19 rated for, and what was it rated for in the beefier versions?"
    expected_answer: "It was rated for up to 300 Nm of torque, or 370 Nm in the beefier versions."
    doc: tiptronic.md
    answer_location: { type: line_range, start: 15, end: 15 }
    tags: [factual, direct-lookup]

  - id: q-002
    question: "How much heavier was a Tiptronic-equipped 996 compared to the same car with a manual gearbox?"
    expected_answer: "Roughly 31 kg heavier."
    doc: tiptronic.md
    answer_location: { type: line_range, start: 15, end: 15 }
    tags: [factual, direct-lookup]

  - id: q-003
    question: "Is Tiptronic a specific type of transmission mechanism, or something else?"
    expected_answer: "It's a trademark, not a mechanism. Tiptronic was Porsche's name for an ordinary torque-converter automatic with a manual override gate, and it was even built around two physically different transmissions over time (a ZF unit, then a Mercedes-Benz 722.6) while keeping the same badge — the name describes a way of driving, not a particular set of internals."
    doc: tiptronic.md
    answer_location: { type: section, value: "A Trademark With Two Dozen Aliases; The Badge Outlived the Box" }
    tags: [adversarial, factual, synthesis]

  - id: q-004
    question: "Does Porsche still sell a Tiptronic-badged transmission today, and if so, where?"
    expected_answer: "Yes. Even though the rest of Porsche's lineup has moved to PDK, the torque-converter Tiptronic S is still offered in the Cayenne, because torque converters handle sustained towing loads better than a dual-clutch box does."
    doc: tiptronic.md
    answer_location: { type: line_range, start: 31, end: 31 }
    tags: [synthesis, easily-conflated]

  - id: q-005
    question: "Did every manufacturer's Tiptronic-style manual mode give the computer final override authority over the driver?"
    expected_answer: "Not every one. Most did, but Aston Martin's version in the DB9 loosened that leash further, holding a gear at redline instead of shifting up for the driver and blipping the throttle on downshifts, giving the driver more actual authority than Porsche's own original design did."
    doc: tiptronic.md
    answer_location: { type: line_range, start: 23, end: 23 }
    tags: [buried-detail, exception]

  - id: q-006
    question: "In Audi's five-speed Tiptronic, does selecting manual mode give the driver full control over every gear change?"
    expected_answer: "No. Even in manual mode it still automatically upshifts from first to second and second to third when pulling away, only handing control back to the driver for third-to-fourth and fourth-to-fifth. It will also still upshift on its own if the driver holds a gear to the redline, and downshifts on deceleration happen automatically too."
    doc: tiptronic.md
    answer_location: { type: line_range, start: 21, end: 21 }
    tags: [adversarial, factual]

  - id: q-007
    question: "How many shift maps did the ZF control unit use compared to the Mercedes-Benz 722.6 that replaced it?"
    expected_answer: "The ZF control unit worked from a handful of roughly five shift maps, while the 722.6 shipped with something like 250 of them."
    doc: tiptronic.md
    answer_location: { type: line_range, start: 43, end: 43 }
    tags: [synthesis, quantitative]

  - id: q-008
    question: "Why did Porsche replace the ZF Tiptronic with the Mercedes-Benz 722.6 starting in 2002?"
    expected_answer: "When the 996.2 generation 911 moved to bigger, more powerful engines, the ZF Tiptronic apparently couldn't handle the extra torque reliably, so Porsche switched to the Mercedes-Benz 722.6 instead."
    doc: tiptronic.md
    answer_location: { type: line_range, start: 41, end: 41 }
    tags: [factual, buried-detail]

