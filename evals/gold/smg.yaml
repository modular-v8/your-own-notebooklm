- id: q-003
  turns:
  - question: How does the reliability reputation of SMG I compare to the car it debuted
      in, versus SMG II and its debut car?
  expected_answer: SMG I debuted in the E36 M3 and was a rough first attempt — relatively
    fragile and unreliable, with owners often reporting costly repairs. SMG II debuted
    in the 2001 E46 M3 (alongside the S54 straight-six) and is the iteration that
    became truly famous, for better or worse, rather than being singled out as unreliable
    in the same way.
  sources:
  - doc: smg.md
    answer_location:
      type: line_range
      start: 15
      end: 17
  tags:
  - synthesis
- id: q-004
  turns:
  - question: How does DRIVELOGIC behavior differ between its lowest and highest settings?
  expected_answer: At the lower settings, the gearbox pulls away in a taller gear
    (second instead of first), shifts earlier around 2,500 rpm, reaches top gear sooner
    for efficiency, and shifts gently. At the higher settings, it holds gears longer,
    lets revs climb further (shift points moving toward 3,500 rpm and beyond under
    hard acceleration), favours lower gears for sharper response, and shifts both
    up and down far more aggressively — with the highest manual-mode setting firing
    shifts as fast as 80 milliseconds.
  sources:
  - doc: smg.md
    answer_location:
      type: line_range
      start: 42
      end: 44
  tags:
  - synthesis
