- id: q-009
  turns:
  - question: Is lifting off the throttle during a shift a universally agreed-upon
      technique for driving an SMG well?
  expected_answer: No. It's the technique most owners land on and is described as
    smoothing out the clunky, jerky shifting, but not everyone agrees it's necessary
    — some argue it can even confuse the shift logic, since the SMG adapts to its
    driver over time.
