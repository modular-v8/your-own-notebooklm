entries:
  - id: q-001
    question: "In what year did BMW coin the concept of the Sequential Manual Gearbox?"
    expected_answer: "1996."
    doc: smg.md
    answer_location: { type: line_range, start: 11, end: 11 }
    tags: [factual, direct-lookup]

  - id: q-002
    question: "In manual mode at the highest DRIVELOGIC setting, how fast can the SMG fire off a shift?"
    expected_answer: "As quickly as 80 milliseconds."
    doc: smg.md
    answer_location: { type: line_range, start: 44, end: 44 }
    tags: [factual, direct-lookup]

  - id: q-003
    question: "How does the reliability reputation of SMG I compare to the car it debuted in, versus SMG II and its debut car?"
    expected_answer: "SMG I debuted in the E36 M3 and was a rough first attempt — relatively fragile and unreliable, with owners often reporting costly repairs. SMG II debuted in the 2001 E46 M3 (alongside the S54 straight-six) and is the iteration that became truly famous, for better or worse, rather than being singled out as unreliable in the same way."
    doc: smg.md
    answer_location: { type: line_range, start: 15, end: 17 }
    tags: [synthesis]

  - id: q-004
    question: "How does DRIVELOGIC behavior differ between its lowest and highest settings?"
    expected_answer: "At the lower settings, the gearbox pulls away in a taller gear (second instead of first), shifts earlier around 2,500 rpm, reaches top gear sooner for efficiency, and shifts gently. At the higher settings, it holds gears longer, lets revs climb further (shift points moving toward 3,500 rpm and beyond under hard acceleration), favours lower gears for sharper response, and shifts both up and down far more aggressively — with the highest manual-mode setting firing shifts as fast as 80 milliseconds."
    doc: smg.md
    answer_location: { type: line_range, start: 42, end: 44 }
    tags: [synthesis]

  - id: q-005
    question: "Which component in the SMG II hardware is responsible for deciding exactly when to shift?"
    expected_answer: "The DME (MSS54) — described as the brain that decides exactly when to shift."
    doc: smg.md
    answer_location: { type: line_range, start: 27, end: 38 }
    tags: [factual, table-lookup]

  - id: q-006
    question: "Which cars used the SMG III, and in what years was it in operation?"
    expected_answer: "SMG III was used in the E60 M5 and E63/E64 M6, operating from roughly 2005 to 2010."
    doc: smg.md
    answer_location: { type: line_range, start: 52, end: 56 }
    tags: [factual, table-lookup]

  - id: q-007
    question: "Could you get a manual gearbox in the E60 M5 or E63/E64 M6, and if so, where?"
    expected_answer: "Yes, but only in the US — the manual version of the M5 and M6 was offered exclusively in the American market."
    doc: smg.md
    answer_location: { type: line_range, start: 19, end: 19 }
    tags: [factual, buried-detail]

  - id: q-008
    question: "When inspecting a used E46 M3, is the SMG the only area a buyer should have checked?"
    expected_answer: "No. The SMG is one of three areas commonly flagged for pre-purchase inspection on the E46 M3, alongside the VANOS system and the rear subframe."
    doc: smg.md
    answer_location: { type: line_range, start: 64, end: 64 }
    tags: [adversarial, factual]

  - id: q-009
    question: "Is lifting off the throttle during a shift a universally agreed-upon technique for driving an SMG well?"
    expected_answer: "No. It's the technique most owners land on and is described as smoothing out the clunky, jerky shifting, but not everyone agrees it's necessary — some argue it can even confuse the shift logic, since the SMG adapts to its driver over time."
    doc: smg.md
    answer_location: { type: line_range, start: 72, end: 74 }
    tags: [synthesis, hedged-claim]

