entries:
- id: q-001
  question: What did AMG replace the torque converter with in the SpeedShift MCT, and when and in what
    car did it debut?
  expected_answer: AMG replaced the torque converter and its lock-up clutch with a single compact wet
    start-off clutch (Nass-Anfahrkupplung, or NAK). It debuted in 2008 in the R230 SL 63 AMG.
  sources:
  - doc: amg_mct.md
    answer_location:
      type: line_range
      start: 17
      end: 17
  tags:
  - factual
  - direct-lookup
- id: q-002
  question: What is the fastest shift time quoted for the AMG SpeedShift MCT?
  expected_answer: As low as 100 milliseconds (0.1 seconds), depending on drive mode.
  sources:
  - doc: amg_mct.md
    answer_location:
      type: line_range
      start: 31
      end: 31
  tags:
  - factual
  - direct-lookup
- id: q-003
  question: The document gives two different inertia-related percentage figures for the MCT. What are
    they, and what does each one refer to?
  expected_answer: The start-off clutch itself has around 60% lower rotational inertia than a fluid-filled
    torque converter. Separately, the inertia of all the rotating parts of the transmission as a whole
    was cut by about 30% compared to AMG's torque-converter 7G-Tronic.
  sources:
  - doc: amg_mct.md
    answer_location:
      type: line_range
      start: 23
      end: 23
  tags:
  - synthesis
  - easily-conflated
- id: q-004
  question: Is a DCT always faster than the MCT, or does it depend on the type of shift?
  expected_answer: It depends. For a sequential change with the next gear pre-selected, a DCT shifts in
    roughly 50 ms, faster than the MCT's ~100 ms, and wins on a track where shifts are predictable. But
    for an out-of-sequence, multi-gear downshift, a DCT slows down while the MCT shifts it just as fast
    as a single-gear change — which is why some owners prefer the MCT on the road.
  sources:
  - doc: amg_mct.md
    answer_location:
      type: line_range
      start: 46
      end: 47
  tags:
  - synthesis
  - conditional
- id: q-005
  question: Does the "Multi-Clutch" in AMG SpeedShift MCT refer to the transmission having two clutches
    like a dual-clutch gearbox?
  expected_answer: No. The MCT has a single input shaft and a single multi-plate wet clutch handling what
    the torque converter used to do. "Multi-Clutch" instead refers to the multiple internal clutches and
    brakes of the planetary gearset that the standard 722.9 torque-converter gearbox already used to select
    its seven gears.
  sources:
  - doc: amg_mct.md
    answer_location:
      type: line_range
      start: 19
      end: 19
  tags:
  - adversarial
  - factual
- id: q-006
  question: What torque figure is the 9-speed MCT rated to handle?
  expected_answer: Around 900 N·m.
  sources:
