  - buried-detail
- id: q-007
  question: What three special functions does the document describe as the MCT's 'party tricks'?
  expected_answer: Automatic double-declutch rev-matching downshifts (Zwischengas), multiple-gear downshifts
    in a single move (e.g. skipping from 7th straight to 4th), and RaceStart, a launch-control function
    coordinated by the AMG DRIVE UNIT controller.
  sources:
  - doc: amg_mct.md
    answer_location:
      type: line_range
      start: 38
      end: 40
  tags:
  - factual
  - list-lookup
- id: q-008
  question: Why does servicing the MCT differ from servicing a standard 722.9 / 7G-Tronic when it comes
    to draining the transmission fluid?
  expected_answer: On a normal 722.9 / 7G-Tronic, fluid is trapped inside the torque converter and needs
    its own separate drain step. Because the MCT has no torque converter, effectively all of its fluid
    drains through the main plug instead.
  sources:
  - doc: amg_mct.md
    answer_location:
      type: line_range
      start: 52
      end: 52
  tags:
  - synthesis
- id: q-009
  question: Was the original 2005 AMG SpeedShift a torque-converter transmission or the wet-clutch MCT
    design?
  expected_answer: It was a torque-converter transmission. The 2005 AMG SpeedShift on the SLK 55 AMG was
    a performance-tuned version of the 7-speed 7G-Tronic (722.9 family) and still used a torque converter;
    that performance torque-converter version was later branded SpeedShift TCT / 7G-Tronic Sport. The
    wet-clutch MCT design did not appear until 2008.
  sources:
  - doc: amg_mct.md
    answer_location:
      type: line_range
      start: 11
      end: 11
  tags:
  - buried-detail
  - easily-conflated
