# raglab configuration. Secrets (ANTHROPIC_API_KEY, OPENROUTER_API_KEY) stay
# in the environment (.env) -- never in this file.

[provider]
# One of: auto | agent_sdk | anthropic | openrouter
# "auto" resolves at startup by credential availability, in this fixed order:
# agent_sdk (claude CLI on PATH) -> anthropic (ANTHROPIC_API_KEY) -> openrouter (OPENROUTER_API_KEY).
# Override without editing this file via the RAGLAB_PROVIDER environment variable.
name = "auto"

[answer]
model = "claude-sonnet-5"
# provider = "anthropic"  # uncomment to pin the answer role to a specific provider

[judge]
# Pinned independently of the answer model so swapping the answer model never
# moves the ruler. Defaults to the same resolved provider as [provider].name.
model = "claude-opus-5"
# provider = "anthropic"  # uncomment to pin the judge role to a specific provider

[run]
concurrency = 5

[retrieval]
# top_k: chunks handed to the model per question.
# score_threshold: below this, the retrieval pipeline refuses rather than
# answering from an empty context -- a safety net, not a tuned value; the
# answer model already refuses correctly on its own (100% in Phase 0).
top_k = 5
score_threshold = 0.35

[collections]
# Named lists of document names. A document may appear in several
# collections; a document in none is indexed but unreachable by any scoped
# query (raglab index warns about this). Retrieval scopes to a collection,
# never to a single document.
rules = ["fb_rules.pdf"]
transmissions = ["amg_mct.md", "egear.md", "smg.md", "tiptronic.md"]
everything = ["fb_rules.pdf", "amg_mct.md", "egear.md", "smg.md", "tiptronic.md"]
